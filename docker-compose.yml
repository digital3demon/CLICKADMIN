# Timeweb App Platform: тип «Docker Compose» (не Next.js).
# Next.js-сборка платформы ставит curl через apt-get и падает без deb.debian.org.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
