# Отдельный vhost для demo.click-lab.online — ДРУГОЙ upstream/port, чем у прода.
# Прод (например :3000) и демо (например :3001) не делят процесс и не делят DATABASE_URL.

upstream dental_lab_demo_next {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name demo.click-lab.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://dental_lab_demo_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
